<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            display: flex;
            justify-content: space-around;
            background-color: black;
            color: white;
            align-items: center;
        }
        #botao{
            color: black;
            background-color: blue;
            
            
        }
    </style>
</head>

<body>
    <form>
        <fieldset>
            <legend>Meu site pessoal!</legend>
            <label for="Nome">Nome Completo:</label>
            <input type="text" id="Nome" placeholder="Digite seu nome!">
            <br>
            <label for="Email">Email:</label>
            <input type="text" id="Email" placeholder="Digite seu Email!">
            <br>
            <label for="Fone">Telefone:</label>
            <input type="text" id="Fone" placeholder="Digite seu número!" maxlength="11">
            <br>
            <label for="Data">Data Nascimento:</label>
            <input type="text" id="Data" placeholder="00/00/0000"  maxlength="8">
            <br>
            <label for="Cidade">Cidade:</label>
            <input type="text" id="Cidade" placeholder="Digite o nome da cidade!" >
            <br>
            <label for="Estado">Estado:</label>
            <input type="text" id="Estado" placeholder="Digite o nome do Estado!" >
            <br>
            <label for="Trabalho">Profissão:</label>
            <input type="text" id="Trabalho" placeholder="Qual é a sua profissão?">
            <br>
            <button type="button" id="botao" onclick="verificar()">Enviar</button>
        </fieldset>
        <fieldset>
            <h3>Minha biografia!</h3>
            <p id="mostrar"></p>
        </fieldset>
    </form>

    <script>
        const verificar = () => {
            let nome = document.getElementById("Nome").value
            let fone = document.getElementById("Fone").value
            let email = document.getElementById("Email").value
            let idade = document.getElementById("Data").value
            let estado = document.getElementById("Estado").value
            let cidade = document.getElementById("Cidade").value
            let trabalho = document.getElementById("Trabalho").value

            //tirando os espaços
            nome = nome.trim()
            fone = fone.trim()
            email = email.trim()

            if (!nome || !fone || !email || !idade || !estado || !trabalho || !cidade) {
                return alert("Preencha todos os campos!")
            }

            let letras = nome.replace(/ /g, "").length
         
            if (isNaN(fone)) {
                return alert("Digite apenas com números!")
            }
            if(nome.length < 10 || fone.length > 11){
                return alert("Telefone invalido!")
            }
           

            if(email.search("@") === -1 || email.search(".") === -1){
                return alert("digite um email valido!")
            }
            idade = String(idade)

            let dia = idade.slice(0,2)
            let mes = idade.slice(2,4)
            let ano = idade.slice(4) 
            let dataReal = new Date(ano,mes -1,dia)

            if(dataReal.getDate() != dia || dataReal.getMonth() != mes -1 || dataReal.getFullYear() != ano){
                return alert("Sua data é invalida!")
            }
            
            let idadeAtual = new Date().getFullYear() - ano
            let falta = Math.abs(100 - idadeAtual)

            let hoje = new Date()

            if(dataReal > hoje){
                return alert("A data não pode estar no futuro!")
            }
            

            document.getElementById("mostrar").innerHTML = `Eu me chamo ${nome}
            nasci no ano ${ano} e tenho ${idadeAtual} moro na cidade ${cidade} do estado de ${estado} e atualmente estou ${trabalho}
            <br>
            <br>
            Meus contatos:
            <br>
            ${email}
            <br>
            ${fone}
            <br>
            Você sabia que a quantidade de letras que tem no seu nome completo é ${letras} e falta exatamente ${falta} para você ter 100 anos
            `
            }

        
    </script>
</body>

</html>
