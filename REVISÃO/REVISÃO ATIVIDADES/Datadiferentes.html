<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Exibindo três datas com formatos diferentes</h1>
    <p>4) Crie um página web que exiba a data atual em pelo menos três formatos diferentes.</p>
    <p id="formato1"></p>
    <p id="formato2"></p>
    <p id="formato3"></p>

    <script>

        // Cria a data atual do computador
        let data = new Date();


        // ==========================
        // FORMATO 1
        // ==========================
        // Data brasileira
        // Exemplo: 28/04/2026

        let formato1 = data.toLocaleDateString("pt-BR");


        // ==========================
        // FORMATO 2
        // ==========================
        // Data completa
        // Exemplo:
        // terça-feira, 28 de abril de 2026

        let formato2 = data.toLocaleDateString("pt-BR", {

            // Nome do dia da semana
            weekday: "long",

            // Dia com 2 números
            day: "2-digit",

            // Nome do mês
            month: "long",

            // Ano completo
            year: "numeric"

        });


        // ==========================
        // FORMATO 3
        // ==========================
        // Formato internacional
        // Exemplo: 2026-04-28


        // Pega ano atual
        let ano = data.getFullYear();


        // Pega mês atual
        // +1 porque janeiro no JS = 0
        let mes = String(data.getMonth() + 1).padStart(2, "0");


        // Pega dia atual
        let dia = String(data.getDate()).padStart(2, "0");


        // Junta tudo
        let formato3 = `${ano}-${mes}-${dia}`;


        // ==========================
        // MOSTRANDO NA TELA
        // ==========================

        document.getElementById("formato1").innerHTML =
            "Formato 1: " + formato1;

        document.getElementById("formato2").innerHTML =
            "Formato 2: " + formato2;

        document.getElementById("formato3").innerHTML =
            "Formato 3: " + formato3;

    </script>
</body>

</html>
