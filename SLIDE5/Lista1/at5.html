<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>/*Sempre será necessário um body no inicio para definir o padrão de fundo, para só então pode modificar ele.*/
        body {
            background-color: rgb(0, 255, 13);
        }
        /* Muito pequeno ciano*/
        @media only screen and (max-width:599px) {
            body {
                background-color: rgb(0, 247, 255);
            }
        }
        /*Pequeno Azul*/
        @media only screen and (min-width:600px){
            body {
                background-color: blue;
            }
        }
        /*Medio Vermelho*/
        @media only screen and (min-width: 768px){
            body {
                background-color: rgb(255, 0, 0);
            }
        }
        /*Grande Laranja */
        @media only screen and (min-width:992px){
            body{
                background-color: rgb(255, 106, 0);
            }
        }
        /*Muito grande Violeta*/
        @media only screen and (min-width: 1200px){
            body{
                background-color: violet;
            }
        }
    </style>

</head>

<body>
    <p>Redimensione a janlea do navegador.
    quando a largura do documento for de 600pixels ou menos,
    a cor de fundo será "lightblue". Caso contrario, será "lightgrey".</p>
</body>

</html>
