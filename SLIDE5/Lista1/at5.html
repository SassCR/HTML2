<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: rgb(0, 255, 13);
        }

        @media only screen and (max-width:600px) {
            body {
                background-color: lightblue;
            }
        }
    </style>

</head>

<body>
    <p>Redimensione a janlea do navegador.
    quando a largura do documento for de 600pixels ou menos,
    a cor de fundo será "lightblue". Caso contrario, será "lightgrey".</p>
</body>

</html>
