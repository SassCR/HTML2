<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*Define o fundo padrão da pagina*/
        body {
            background-color: rgb(0, 255, 13);/*Cor de fundo para telas grandes*/
        }
/*CSS responbsivo: aplica estilos quando a largura é menor ou igual a 600px*/
        @media only screen and (max-width:600px) {
            body {
                background-color: lightblue;/*Cor de fundo para telas pequenas*/
            }
        }
    </style>

</head>

<body>
    <!--Texto explicativo para entender o comportamento do layout-->
    <p>Redimensione a janlea do navegador.
    quando a largura do documento for de 600pixels ou menos,
    a cor de fundo será "lightblue". Caso contrario, será "lightgreen".</p>
</body>

</html>
