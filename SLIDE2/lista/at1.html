<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
        document.addEventListener("DOMContentLoaded", ()=>{
            document.getElementById("Bem").innerText = "Bem Vindo a Nossa aula!";
        })
    </script>
  </head>
  <body>
    <p id="Bem"></p>
  </body>
</html>
<!-- O document.addEventListener("DOMContentLoaded") Espera o html carrega pra depois executar o script -->
