<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="demo" type="text">
    <button type="button" onclick="myfuncao()">Teste input</button>
    <p id="p01"></p>

    <script>
        function myfuncao() {
            const message = document.getElementById("p01");
            message.innerHTML = "";
            let x = document.getElementById("demo").value
            //O try é uma forma de prever um erro.
            try {
                if(x.trim() == "") throw "Vazio";
                if(isNaN(x)) throw "Não é um numero"
                x = Number(x)
                if(x < 5) throw "muito baixo"
                if(x > 10) throw "muito alto"
                
            }
            catch(err) {
                message.innerHTML = "Digitou... " + err;
            }   
        }

    </script>
</body>
</html>
