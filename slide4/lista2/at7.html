
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <legend>Pesquisando nome dentro do texto:</legend>
    <label for="Pesquise">Pesquise:</label>
    <input type="text" id="Pesquise">
    <br>
    <label for="Palavra">Procura ai:</label>
    <input type="text" id="Palavra"><br>
    <button type="button" onclick="start()">ENVIAR</button>

    <p id="exibidor"></p>

    <script>
        function start(){
        let texto = document.getElementById("Pesquise").value

        let textoPegado = texto.search("Palavra")
        
        document.getElementById("exibidor").innerHTML = textoPegado
        }
    </script>
</body>
</html>
