<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Festa da Fruta</h1>
    <p id="exibidor"></p>
    
    <script>
        var fruta = new Array(3);
        fruta[0] = "banana"
        fruta[1] = "laranja"
        fruta[2] = "Maça"
        let espaco = ""
        for(let x  of fruta){
            espaco += `${x} <br>`
        }
        document.getElementById("exibidor").innerHTML = espaco
    </script>
</body>
</html>
