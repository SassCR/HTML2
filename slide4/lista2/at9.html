<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <legend>Programinha</legend>
    <label for="Pesquise">Pesquise:</label>
    <input type="text" id="Pesquise">
    <button type="button" onclick="start()">ENVIAR</button>

    <p id="exibidor"></p>

    <script>
        function start(){
        let texto = document.getElementById("Pesquise").value
        let numeros = texto.match(/[0-9]+/g);
        let altrado = texto.replace(/[0-9]+/g, "#")
        document.getElementById("exibidor").innerHTML = altrado
        }
    </script>
</body>
</html>
