<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Alfabeto do Ciliro</h1>
    <p id="exibidor"></p>

    <script>
        let linguagem = "JavaSCript"
        let maiusculo = linguagem.toUpperCase()
        let espaco = ""
        for(let letra of maiusculo){
            espaco += `${letra} - `
        }
 
        document.getElementById("exibidor").innerHTML = espaco
    </script>
</body>
</html>
