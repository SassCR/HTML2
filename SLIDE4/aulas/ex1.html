<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Perfil do usuario</h2>
    <p id="resultado"></p>
    <script>
        const pessoa = {nome: "Mario", sobrenome: "Souza", idade:30}

        let textoFinal = "";
        for(let propriedade in pessoa){
            textoFinal += pessoa[propriedade] + " ";
        }

        document.getElementById("resultado").innerHTML = textoFinal;
    </script>
</body>
</html>
