<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        function evento() {
            let x = document.getElementById("digite").value
            return alert(`Valor arrendondado para cima ou para baixo:${Math.round(x)} Cell é apenas para cima:${Math.ceil(x)} Floor é apenas para baixo:${Math.floor(x)}`)
        }
    </script>
</head>

<body>
    <label for="digite">Digite aqui:</label>
    <input type="number" id="digite">
    <button type="button" onclick="evento()">start</button>

</body>

</html>
