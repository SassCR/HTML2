<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function evento() {
            let n1 = document.getElementById("n1").value
            let ron = Math.floor(Math.random() *6)
            var resultado
            if(n1 === ron){
                 resultado = "Seu número é igual.";
            }else {
                 resultado = "Seu número é diferente!";
            }
            
            let magica = document.getElementById("magica").innerText =`${ron}\n${resultado}`
            
            
        }
    </script>

</head>

<body>
    <form>
        <legend>Hora de mostrar uma magica :D</legend>
        <label for="n1">Digite seu número:</label>
        <input type="number" id="n1">
        <p id="magica"></p>
        <br>
        <button type="button" onclick="evento()">Start</button>
    </form>
</body>

</html>
